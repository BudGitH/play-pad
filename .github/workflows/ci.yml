# PlayPad CI — runs the docs/CONVENTIONS.md dev commands on every PR and push to main.
# Fork-safe: uses `pull_request` (not pull_request_target), read-only token, no secrets.
# Deploys are NOT done here — Cloudflare Pages' Git integration deploys main and PR previews.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs share one group per PR (superseded ones are cancelled). Every other run gets its own
  # group by commit, so a queued push to main is never replaced by a newer one (GitHub keeps one pending run per group).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ github.event_name }}
  # Cancel superseded PR runs only: every push to main must finish, so each deployed commit has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret scan (CODE_QUALITY.md #14)
        run: npm run secrets
      - name: Lint + format check
        run: npm run check
      - name: Kampung Quest sim unit tests (no browser needed)
        run: npm run test:kq
      - name: Dependency audit (CODE_QUALITY.md #24)
        run: npm audit --audit-level=high

  smoke:
    # Opens the hub and every live game in headless Chromium; fails on any
    # page error, console error or broken same-origin request (tests/smoke.spec.mjs), plus the
    # Sparkle Salon / Brick Buddies / viewport specs. Kampung Quest's two (much slower, software-GL
    # 3D) browser specs run in their own job below so this one stays well inside its budget (R2-Q-01).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (everything except Kampung Quest and @slow)
        run: npm run smoke:core
      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  kampung-quest:
    # Kampung Quest's browser specs, on every PR: the acceptance criteria (tests/kampung-quest-ac.spec.mjs)
    # and the phone / touch layouts (tests/kampung-quest-mobile.spec.mjs). One runner per file so each
    # has its own time budget and a red check names the part. Headless Chromium renders the 3D world
    # in software (SwiftShader), hence the long timeout. The @slow 4x-CPU frame probe is NOT run
    # here: it lives in probes.yml (npm run perf:kq).
    name: Kampung Quest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # an AC failure must not hide the phone result
      matrix:
        include:
          - name: AC
            run: npm run smoke:kq:ac
          - name: Phone
            run: npm run smoke:kq:mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Kampung Quest browser specs (${{ matrix.name }})
        run: ${{ matrix.run }}
      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kq-${{ matrix.name }}-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
